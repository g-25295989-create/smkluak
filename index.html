    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        
        :root {
            --primary-red: #DC2626;
            --highlight-yellow: #FACC15;
            --black: #000000;
            --white: #FFFFFF;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: var(--black);
            overflow-x: hidden;
        }
        
        /* Neo-Brutalist 3D Effects */
        
        .neo-card {
            background: var(--white);
            border: 4px solid var(--black);
            box-shadow: 10px 10px 0px 0px var(--black);
            transition: all 0.2s ease;
        }
        
        .neo-card-red {
            background: var(--primary-red);
            border: 4px solid var(--black);
            box-shadow: 10px 10px 0px 0px var(--black);
            color: var(--white);
        }
        
        .neo-card-yellow {
            background: var(--highlight-yellow);
            border: 4px solid var(--black);
            box-shadow: 10px 10px 0px 0px var(--black);
        }
        
        .neo-button {
            border: 3px solid var(--black);
            box-shadow: 4px 4px 0px 0px var(--black);
            transition: all 0.1s ease;
            position: relative;
            top: 0;
            left: 0;
        }
        
        .neo-button:active {
            box-shadow: 0px 0px 0px 0px var(--black);
            top: 4px;
            left: 4px;
        }
        
        .neo-input {
            border: 3px solid var(--black);
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }
        
        .neo-input:focus {
            box-shadow: 6px 6px 0px 0px var(--highlight-yellow);
            outline: none;
        }
        
        .skew-box {
            transform: skewX(-5deg);
        }
        
        .text-stroke {
            -webkit-text-stroke: 1.5px var(--black);
        }
        
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        
        .animate-marquee {
            display: flex;
            width: 200%;
            animation: marquee 20s linear infinite;
        }
        
        .bg-grid {
            background-size: 40px 40px;
            background-image: radial-gradient(circle, #00000010 1px, transparent 1px);
        }
    </style>
